<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one centred column like a mobile puzzle game — crown/best + sound toggles, huge score, gridded board, praise pops over the board. Single committed "arcade blue" look. */
:root{
  --sky1:#5a86f0;
  --sky2:#3456d1;
  --sky3:#22349a;
  --board:#1b2560;
  --cell:#223075;
  --cellhi:#2b3a88;
  --ink:#ffffff;
  --soft:#c9d5ff;
  --gold:#ffd23f;
  --goldd:#b86a00;
  --red:#ff4d5e;
  --display:"Titan One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--sky2);color:var(--ink);font-family:var(--body);
  background-image:radial-gradient(120% 80% at 50% 0%,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);
  background-attachment:fixed;overflow-x:hidden;
  padding-inline:16px;padding-block:14px 24px;box-sizing:border-box;
  --frame1:#2a3a95;--frame2:#18215a;--frameb:#121a48;
}
body[data-bg="sunset"]{--sky1:#ffb36b;--sky2:#e2536b;--sky3:#6a2566;--frame1:#8a2d6a;--frame2:#4a1540;--frameb:#34102e}
body[data-bg="kente"]{--sky1:#ffcc4d;--sky2:#d98a12;--sky3:#6b3a0c;--frame1:#6b4412;--frame2:#3a2408;--frameb:#2a1a06}
body[data-bg="forest"]{--sky1:#7ee0a2;--sky2:#23916a;--sky3:#0c4436;--frame1:#1d6a52;--frame2:#0f3a2e;--frameb:#0a2a22}
body[data-bg="night"]{--sky1:#4b3aa0;--sky2:#241a5c;--sky3:#0a0822;--frame1:#35287a;--frame2:#1a1344;--frameb:#110c30}
body[data-bg="kente"]::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;
  background:repeating-linear-gradient(90deg,#0b6b3a 0 22px,#111 22px 28px,#c8102e 28px 40px,#111 40px 46px,transparent 46px 92px),
             repeating-linear-gradient(0deg,transparent 0 60px,rgba(0,0,0,.6) 60px 66px)}
body[data-bg="night"] .bgfx{background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff 50%,transparent),radial-gradient(1px 1px at 70% 20%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff 50%,transparent),radial-gradient(1px 1px at 85% 60%,#fff 50%,transparent),radial-gradient(1px 1px at 10% 85%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 55% 45%,#fff 50%,transparent);background-size:300px 300px}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blk{position:absolute;border-radius:18%;opacity:.16;animation:drift linear infinite;
  box-shadow:inset 0 6px 0 rgba(255,255,255,.55),inset 0 -6px 0 rgba(0,0,0,.25)}
@keyframes drift{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(-120vh) rotate(200deg)}}
@media (prefers-reduced-motion:reduce){.blk{animation:none}}

.app{position:relative;z-index:1;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.best{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:1.25rem;color:var(--gold);
  text-shadow:0 2px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.best svg{width:30px;height:24px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.toggles{display:flex;gap:8px}
.tbtn{width:42px;height:42px;border-radius:12px;border:0;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(#4f74e6,#3150c4);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.25),0 3px 0 #1a2a7a;color:#fff}
.tbtn svg{width:22px;height:22px}
.tbtn.off{opacity:.5}
.tbtn:focus-visible,.bigbtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.scorewrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.score{font-family:var(--display);font-size:clamp(3rem,15vw,4.4rem);line-height:.95;letter-spacing:.01em;
  text-shadow:0 4px 0 rgba(10,20,80,.55);font-variant-numeric:tabular-nums;transition:transform .12s}
.score.bump{transform:scale(1.12)}
.next{display:flex;align-items:center;gap:8px;background:rgba(15,25,80,.45);border-radius:14px;padding:6px 10px 6px 12px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
.next small{font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;color:var(--soft)}
.next canvas{width:44px;height:44px;display:block}
.combo{font-family:var(--display);color:var(--gold);font-size:1rem;min-height:1.3em;text-shadow:0 2px 0 rgba(0,0,0,.35)}

.stage{position:relative;width:100%}
.frame{padding:8px;border-radius:22px;background:linear-gradient(var(--frame1),var(--frame2));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.18),0 10px 0 var(--frameb),0 18px 30px rgba(0,0,0,.35)}
.nextname{font-weight:900;font-size:.85rem;line-height:1.1;max-width:9em}

/* settings */
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,10,40,.6);backdrop-filter:blur(4px)}
.panel{width:100%;max-width:380px;max-height:calc(100% - 20px);overflow:auto;border-radius:22px;padding:18px 18px 20px;
  background:linear-gradient(var(--frame1),var(--frame2));box-shadow:inset 0 3px 0 rgba(255,255,255,.2),0 8px 0 var(--frameb),0 20px 40px rgba(0,0,0,.4);
  display:flex;flex-direction:column;gap:16px}
.panel header{display:flex;align-items:center;justify-content:space-between}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.8rem;color:var(--gold);-webkit-text-stroke:2px #6b2a00;paint-order:stroke fill;text-shadow:0 3px 0 #6b2a00}
.sect{display:flex;flex-direction:column;gap:8px}
.sect > span{font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;color:var(--soft)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{aspect-ratio:1;max-width:100%;border-radius:12px;border:3px solid transparent;cursor:pointer;padding:0;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.25)}
.sw[aria-checked="true"]{border-color:#fff;transform:scale(1.06)}
.sw:focus-visible,.seg button:focus-visible,.switch:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.swlab{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;font-size:.7rem;text-align:center;color:var(--soft);font-weight:700}
.rowset{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:900;font-size:1.05rem;
  background:rgba(0,0,0,.18);border-radius:14px;padding:10px 12px}
.rowset svg{width:22px;height:22px;vertical-align:-5px;margin-right:8px}
.switch{width:58px;height:32px;border-radius:999px;border:0;cursor:pointer;position:relative;background:#555c7a;box-shadow:inset 0 2px 4px rgba(0,0,0,.4);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:#34c35a}
.switch[aria-checked="true"]::after{left:29px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(0,0,0,.2);border-radius:14px;padding:5px}
.seg button{font:900 1rem var(--body);color:#fff;background:transparent;border:0;border-radius:10px;padding:9px 4px;cursor:pointer}
.seg button[aria-checked="true"]{background:linear-gradient(#ffd23f,#f0a500);color:#4a2400;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 2px 0 #9a5a00}
.bigbtn.orange{background:linear-gradient(#ffb04a,#f07a12);box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.2),0 5px 0 #a24a00}
.panel .bigbtn{width:100%}
#board{display:block;width:100%;height:auto;border-radius:16px;touch-action:none;cursor:pointer;background:var(--board)}
#board:focus-visible{outline:3px solid var(--gold);outline-offset:4px}

.praise{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:3}
.praise span{display:inline-block;font-family:var(--display);font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;
  color:var(--gold);-webkit-text-stroke:3px #6b2a00;paint-order:stroke fill;text-shadow:0 5px 0 #6b2a00,0 8px 18px rgba(0,0,0,.35);
  opacity:0;white-space:nowrap}
.praise span.t2{color:#7dffb0;-webkit-text-stroke-color:#0b5a2e;text-shadow:0 5px 0 #0b5a2e,0 8px 18px rgba(0,0,0,.35)}
.praise span.t3{color:#7fe3ff;-webkit-text-stroke-color:#0a4a78;text-shadow:0 5px 0 #0a4a78,0 8px 18px rgba(0,0,0,.35)}
.praise span.t4{color:#ffa3e0;-webkit-text-stroke-color:#6a0a55;text-shadow:0 5px 0 #6a0a55,0 8px 18px rgba(0,0,0,.35)}
.praise span.rec{color:#fff;-webkit-text-stroke-color:#b3001e;text-shadow:0 5px 0 #b3001e,0 0 30px rgba(255,210,63,.9)}
.praise span.go{animation:pop 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.praise span.spoil{color:#c9f07a;-webkit-text-stroke-color:#2f4a08;text-shadow:0 5px 0 #2f4a08,0 8px 18px rgba(0,0,0,.35);font-size:clamp(2rem,9vw,2.8rem);white-space:normal;max-width:90%}
.praise span.spoil.go{animation-duration:1.9s}
.overlay h2#overtitle{color:#c9f07a;-webkit-text-stroke-color:#2f4a08;text-shadow:0 5px 0 #2f4a08}
.recnote{font-family:var(--display);font-size:1.3rem;color:#fff;background:#d6203a;padding:4px 14px;border-radius:999px;box-shadow:0 3px 0 #7a0016}
.recnote[hidden]{display:none}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-6deg)}18%{opacity:1;transform:scale(1.15) rotate(2deg)}30%{transform:scale(1) rotate(0)}80%{opacity:1;transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(.95) translateY(-24px)}}
@media (prefers-reduced-motion:reduce){.praise span.go{animation:fade 1.3s forwards}@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}}

.overlay{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  text-align:center;padding:24px;border-radius:22px;background:rgba(14,22,70,.78);backdrop-filter:blur(3px)}
.overlay h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,10vw,3rem);line-height:1;color:var(--gold);
  -webkit-text-stroke:3px #6b2a00;paint-order:stroke fill;text-shadow:0 5px 0 #6b2a00}
.overlay h2.rec{color:#fff;-webkit-text-stroke-color:#b3001e;text-shadow:0 5px 0 #b3001e}
.overlay .logo{font-size:clamp(2.6rem,12vw,3.6rem)}
.overlay .logo em{font-style:normal;color:#7dffb0;-webkit-text-stroke-color:#0b5a2e}
.overlay p{margin:0;color:var(--soft);font-weight:700;max-width:28ch;line-height:1.4}
.overlay .big{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.overlay .row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--soft);font-weight:900}
.overlay .row img{width:52px;height:52px}
.bigbtn{font-family:var(--display);font-size:1.4rem;color:#fff;border:0;cursor:pointer;padding:12px 34px;border-radius:16px;
  background:linear-gradient(#5ee07e,#27b24b);box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.2),0 5px 0 #157a30;
  text-shadow:0 2px 0 rgba(0,0,0,.25)}
.bigbtn:active{transform:translateY(3px);box-shadow:inset 0 4px 0 rgba(255,255,255,.4),0 2px 0 #157a30}
.hint{font-size:.8rem;text-align:center;color:var(--soft);font-weight:700;opacity:.85}
</style>

<script>
(function(){
const W=400,H=560,LINE=100,CELL=50;
const DISHES=[
 {n:"Groundnut",r:14,c:"#c99a5b",e:"#8a5f2b"},
 {n:"Plantain chips",r:22,c:"#f0c93c",e:"#b8891a"},
 {n:"Bofrot",r:25,c:"#c9772a",e:"#8a4a14"},
 {n:"Kelewele",r:31,c:"#e8892a",e:"#a3520f"},
 {n:"Akara",r:37,c:"#b86a2a",e:"#7a3f12"},
 {n:"Suya",r:45,c:"#7a3b1c",e:"#45200c"},
 {n:"Kenkey",r:53,c:"#e6dcb8",e:"#8f9a4a"},
 {n:"Waakye",r:62,c:"#6b3a3c",e:"#3e1f21"},
 {n:"Banku & tilapia",r:72,c:"#f3efe4",e:"#9a9a8e"},
 {n:"Fufu & light soup",r:82,c:"#d9502a",e:"#8f2c12"},
 {n:"Jollof rice",r:94,c:"#d2461d",e:"#8a2a0c"}
];
const PTS=DISHES.map((_,l)=>(l+1)*(l+2)/2);

// ---------- dish art
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const TEX=DISHES.map((_,l)=>{const R=rng(97+l*131);return Array.from({length:40},()=>({a:R()*6.283,d:Math.sqrt(R())*.78,s:R(),t:R()}))});
function blob(ctx,r,bumps,amp,seed){const R=rng(seed);ctx.beginPath();const off=Array.from({length:bumps},()=>1+(R()-.5)*amp);
  for(let i=0;i<=64;i++){const a=i/64*6.283;const k=off[Math.floor(i/64*bumps)%bumps];const x=Math.cos(a)*r*k,y=Math.sin(a)*r*k;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
function lighten(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.round(r+(255-r)*k);g=Math.round(g+(255-g)*k);b=Math.round(b+(255-b)*k);return`rgb(${r},${g},${b})`}
function base(ctx,r,c,e){const g=ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);g.addColorStop(0,lighten(c,.25));g.addColorStop(1,c);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=Math.max(1.5,r*.07);ctx.strokeStyle=e;ctx.stroke()}
function dots(ctx,r,l,col,size,count,from=0){ctx.fillStyle=col;const T=TEX[l];for(let i=from;i<from+count;i++){const p=T[i%40];ctx.beginPath();ctx.arc(Math.cos(p.a)*p.d*r,Math.sin(p.a)*p.d*r,size*r*(.6+p.s*.6),0,6.283);ctx.fill()}}
function plate(ctx,r){ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fillStyle="#fbf7ee";ctx.fill();ctx.lineWidth=Math.max(1.5,r*.05);ctx.strokeStyle="#7d7a8c";ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.86,0,6.283);ctx.strokeStyle="#d3cfd9";ctx.lineWidth=r*.03;ctx.stroke()}

let best=0;try{best=+localStorage.getItem("chopmerge-best")||0}catch(e){}
function rand(){const w=[30,26,20,14,10];let t=Math.random()*100;for(let i=0;i<5;i++){if((t-=w[i])<0)return i}return 0}

function drop(){

}
function addScore(n){S.score+=n;const e=$("score");e.classList.add("bump");setTimeout(()=>e.classList.remove("bump"),120);
  if(!recShown&&prevBest>0&&S.score>prevBest){recShown=true;setTimeout(()=>{showPraise(T("rec"),"rec");lastPraiseT=performance.now();lastPraiseTier=9;SFX.record();confetti(W/2,H*.3,90)},350)}}
function merge(a,b){

  burst(x,y,DISHES[a.l].c,a.r);
  if(a.l===10){const g=PTS[10]*2*combo;addScore(g);floaters.push({x,y,t:"+"+g,life:1.1});SFX.merge(11);praise(5,T("dbl"));confetti(x,y,80);return}
  const l=a.l+1,g=Math.round(PTS[l]*(1+(combo-1)*.5));addScore(g);

function burst(x,y,c,r){for(let i=0;i<16;i++){const a=Math.random()*6.283,s=80+Math.random()*160;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.6,max:.6,c,sz:2+Math.random()*r*.12,k:0})}

const CONF=["#ff4d5e","#ffd23f","#5ee07e","#7fe3ff","#b58cff","#ff9a3c"];

function step(dt){

// ---------- drawing
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
const gridCv=document.createElement("canvas");
function buildGrid(){const th=THEMES[BG]||THEMES.blue;gridCv.width=W*dpr;gridCv.height=H*dpr;const g=gridCv.getContext("2d");g.scale(dpr,dpr);

    rr(g,x+3,y+3,CELL-6,4,[7,7,0,0]);g.fillStyle="rgba(255,255,255,.04)";g.fill();
    rr(g,x+3,y+CELL-7,CELL-6,4,[0,0,7,7]);g.fillStyle="rgba(0,0,0,.18)";g.fill()}
  const v=g.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.75);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(5,10,40,.45)");g.fillStyle=v;g.fillRect(0,0,W,H)}

function draw(){

  tops.forEach((b,i)=>{for(let j=0;j<3;j++){const x0=b.x+(j-1)*b.r*.45,ph=now/400+i*2+j;const rise=((now/1600+j*.33+i*.17)%1);

      for(let t=0;t<=1;t+=.1){const y=b.y-b.r-8-rise*50-t*34,x=x0+Math.sin(ph+t*7)*6;t?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}

// ---------- settings sheet
let paused=false,lastFocus=null;
function openSettings(){initAudio();SFX.tap();paused=true;lastFocus=document.activeElement;$("sheet").hidden=false;$("closebtn").focus()}
function closeSettings(){paused=false;lastT=performance.now();$("sheet").hidden=true;SFX.tap();(lastFocus||cv).focus()}
$("gearbtn").onclick=openSettings;$("closebtn").onclick=closeSettings;
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSettings()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSettings()});
$("sfxsw").onclick=()=>{sfxOn=!sfxOn;saveSettings();setToggles();SFX.tap()};
$("mussw").onclick=()=>{musOn=!musOn;saveSettings();setToggles()};
$("langseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;LG=b.dataset.lang;saveSettings();applyLang();SFX.tap();showPraise(T("tiers")[4][0],"t4")});
$("replaybtn").onclick=()=>{$("sheet").hidden=true;paused=false;begin()};
(function(){const sw=$("swatches"),lab=$("swlab");
  for(const[k,t]of Object.entries(THEMES)){const b=document.createElement("button");b.className="sw";b.dataset.bg=k;b.setAttribute("role","radio");b.setAttribute("aria-label",t.n);b.style.background=t.sw;
    b.onclick=()=>{BG=k;saveSettings();applyBG();SFX.tap()};sw.appendChild(b);const s=document.createElement("div");s.textContent=t.n;lab.appendChild(s)}})();

// background floating blocks
(function(){const f=$("bgfx"),cols=["#ff4d5e","#ffd23f","#5ee07e","#7fe3ff","#b58cff","#ff9a3c"];
  for(let i=0;i<14;i++){const d=document.createElement("div");d.className="blk";const s=28+Math.random()*60;
    d.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${100+Math.random()*30}%;background:${cols[i%6]};animation-duration:${22+Math.random()*26}s;animation-delay:-${Math.random()*40}s`;
    f.appendChild(d)}})();

// ---------- boot (keeps a running game through page updates)
function start(data){
  S=data&&data.S?data.S:newState();
  if(data&&data.prevBest!=null){prevBest=data.prevBest;recShown=!!data.recShown}
  S.bodies.forEach(b=>b.born=performance.now()-2000);
  $("startov").hidden=!!S.started;$("overov").hidden=!S.over;
  setToggles();applyBG();applyLang();shownScore=-1;ui.n=-1;ui();
  if(!start.run){start.run=true;requestAnimationFrame(loop)}
}
window.claude?.hot?.snapshot?.(()=>({S,prevBest,recShown}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>

</body></html>
